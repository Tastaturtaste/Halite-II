services:
  db:
    # MySQL 5.7 is required, not MariaDB: the coordinator leaderboard query uses `ANY_VALUE()`, which MariaDB lacks.
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: halite
      MYSQL_USER: halite
      MYSQL_PASSWORD: halite
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: sleep infinity
    environment:
      DATABASE_URL: mysql+pymysql://halite:halite@db:3306/halite
      FLASK_SECRET_KEY: dev-only-secret-change-me
      SITE_URL: http://localhost:4000
      API_URL: http://localhost:5000
      OAUTH_GITHUB_CONSUMER_KEY: dev-oauth-key
      OAUTH_GITHUB_CONSUMER_SECRET: dev-oauth-secret
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
      - "5001:5001"
      - "4000:4000"

volumes:
  db-data: